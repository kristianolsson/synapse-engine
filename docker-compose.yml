services:
  synapse:
    build: .
    restart: always
    env_file: /share/CE_CACHEDEV2_DATA/synapse/.env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /share/CE_CACHEDEV2_DATA/synapse/notes:/app/notes
      - /share/CE_CACHEDEV2_DATA/synapse/synapse-engine:/app/synapse-engine
      - /share/CE_CACHEDEV2_DATA/synapse/credentials/claude:/home/synapse/.claude
      - /share/CE_CACHEDEV2_DATA/synapse/credentials/gemini:/home/synapse/.gemini
      - /share/CE_CACHEDEV2_DATA/synapse/ssh/id_ed25519:/home/synapse/.ssh/id_ed25519
      - /share/CE_CACHEDEV2_DATA/synapse/ssh/id_ed25519.pub:/home/synapse/.ssh/id_ed25519.pub
      - /share/CE_CACHEDEV2_DATA/synapse/data:/app/data
      # E*TRADE: persistent OAuth tokens and browser session (shared with options-bot credentials)
      - /share/CE_CACHEDEV2_DATA/synapse/credentials/etrade/.etrade_tokens:/home/synapse/.etrade_tokens
      - /share/CE_CACHEDEV2_DATA/synapse/credentials/etrade/.etrade_browser_profile:/home/synapse/.etrade_browser_profile
      # Amazon Fresh: persistent Firefox browser session
      - /share/CE_CACHEDEV2_DATA/synapse/credentials/amazon/.amazon-fresh-session:/home/synapse/.amazon-fresh-session
