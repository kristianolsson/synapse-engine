services:
  synapse:
    build:
      context: .
      args:
        GIT_USER_NAME: ${GIT_USER_NAME:?Set GIT_USER_NAME in a .env file next to this compose file — see .env.compose.example}
        GIT_USER_EMAIL: ${GIT_USER_EMAIL:?Set GIT_USER_EMAIL in a .env file next to this compose file — see .env.compose.example}
    restart: always
    env_file: ${SYNAPSE_HOST_DIR:?Set SYNAPSE_HOST_DIR in a .env file next to this compose file — see .env.compose.example}/.env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${SYNAPSE_HOST_DIR}/vault:/app/vault
      - ${SYNAPSE_HOST_DIR}/synapse-engine:/app/synapse-engine
      - ${SYNAPSE_HOST_DIR}/credentials/claude:/home/synapse/.claude
      - ${SYNAPSE_HOST_DIR}/credentials/gemini:/home/synapse/.gemini
      - ${SYNAPSE_HOST_DIR}/ssh/id_ed25519:/home/synapse/.ssh/id_ed25519
      - ${SYNAPSE_HOST_DIR}/ssh/id_ed25519.pub:/home/synapse/.ssh/id_ed25519.pub
      - ${SYNAPSE_HOST_DIR}/data:/app/data
      # E*TRADE: persistent OAuth tokens and browser session (shared with options-bot credentials)
      - ${SYNAPSE_HOST_DIR}/credentials/etrade/.etrade_tokens:/home/synapse/.etrade_tokens
      - ${SYNAPSE_HOST_DIR}/credentials/etrade/.etrade_browser_profile:/home/synapse/.etrade_browser_profile
      # Amazon Fresh: persistent Firefox browser session
      - ${SYNAPSE_HOST_DIR}/credentials/amazon/.amazon-fresh-session:/home/synapse/.amazon-fresh-session
